server.port=8080

# Spring Application Name
spring.application.name=aegis-policy-engine

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aegis_ap2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Execute schema.sql & data initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# AP2 & Razorpay Configuration (Isolated in Gatekeeper)
ap2.secret-key=${AP2_SECRET_KEY:aegis_ap2_cryptographic_secret_key_2026_x402}
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_mock_12345}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:mock_razorpay_secret_key_67890}
